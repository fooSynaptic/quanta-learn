<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 740"
     role="img" aria-label="Quanta Learn core learning flow with routing decisions"
     font-family="Helvetica Neue,Arial,sans-serif">
<defs>
