    <path d="M0,0 L10,4 L0,8 Z" fill="#2563eb"/>
  </marker>
  <marker id="arrow-violet" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="8" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,0 L10,4 L0,8 Z" fill="#7c3aed"/>
